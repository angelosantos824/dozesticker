<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#07050d">
    <title>DOZESTICKER | Entrar</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="assets/images/logo/icon.png" type="image/png">
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/pages/auth.css">
    <script type="module" src="assets/js/auth/auth-guard.js"></script>
    <script type="module" src="assets/js/app.js"></script>
  </head>
  <body data-page="login">
    <main class="auth-page">
      <section class="auth-shell">
        <a class="auth-brand" href="index.html">
          <img src="assets/images/logo/icon.png" alt="" width="48" height="48">
          <span>DOZESTICKER <small>Uma solução DOZEDEV</small></span>
        </a>
        <form class="surface auth-card auth-form" data-login-form>
          <div>
            <h1>Entrar</h1>
            <p>Acesse e gerencie sua coleção aqui.</p>
          </div>
          <label class="field">
            <span>Email</span>
            <input name="email" type="email" autocomplete="email" required>
          </label>
          <label class="field">
            <span>Senha</span>
            <input name="password" type="password" autocomplete="current-password" required>
          </label>
          <p class="form-message" data-auth-message></p>
          <button class="button button-primary" type="submit">Entrar</button>
          <div class="auth-links">
            <a href="cadastro.html">Criar conta</a>
            <a href="recuperar-senha.html">Esqueci minha senha</a>
          </div>
        </form>
        <footer class="dozedev-footer">
          Uma solução &middot; <a href="https://dozedev.pt" target="_blank" rel="noopener noreferrer">dozedev.pt</a>
        </footer>
      </section>
    </main>
  </body>
</html>
