<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#07140f">
    <title>DOZESTICKER | Nova senha</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/pages/auth.css">
    <script type="module" src="assets/js/auth/auth-guard.js"></script>
    <script type="module" src="assets/js/app.js"></script>
  </head>
  <body data-page="nova-senha">
    <main class="auth-page">
      <section class="auth-shell">
        <a class="auth-brand" href="index.html">
          <span class="brand-mark">12</span>
          <span>DOZESTICKER</span>
        </a>
        <form class="surface auth-card auth-form" data-new-password-form>
          <div>
            <p class="eyebrow">Seguranca</p>
            <h1>Nova senha</h1>
            <p>Defina uma senha nova com pelo menos 8 caracteres.</p>
          </div>
          <label class="field">
            <span>Nova senha</span>
            <input name="password" type="password" autocomplete="new-password" minlength="8" required>
          </label>
          <label class="field">
            <span>Confirmar nova senha</span>
            <input name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
          </label>
          <p class="form-message" data-auth-message></p>
          <button class="button button-primary" type="submit">Salvar senha</button>
        </form>
      </section>
    </main>
  </body>
</html>
